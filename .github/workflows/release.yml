# Builds the installers for Windows, macOS and Linux and attaches them to a GitHub Release,
# and publishes the website to GitHub Pages.
#
# Website: every push to main (GitHub Pages only accepts deployments from the main branch, not from tags).
# Installers: push a tag, e.g.  git tag v1.0.0 && git push origin v1.0.0  (or run this workflow by hand)
# The AI models are not stored in git (too large); each job downloads them from Hugging Face.
# No secrets are needed: GITHUB_TOKEN is provided by GitHub automatically.
name: release
on:
  push:
    branches: [main]   # publishes the website
    tags: ['v*']       # builds the installers
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  installers:
    if: github.ref != 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, script: 'dist:linux', files: 'dist/*.AppImage dist/*.deb' }
          - { os: windows-latest, script: 'dist:win', files: 'dist/*.exe' }
          # Intel runner: the arm64 pool often has no free machine. It builds the Apple Silicon .dmg only:
          # onnxruntime-node has no Intel Mac binary, so it cannot run the AI (or the tests) there.
          - { os: macos-15-intel, script: 'dist:mac', files: 'dist/*.dmg' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run prepare-model
        if: runner.os != 'macOS'
      - run: npm test
        if: runner.os != 'macOS'
      # Same file prepare-model copies; the text embeddings are already in git.
      - run: mkdir -p models && curl -fL -o models/vision.onnx https://huggingface.co/Xenova/clip-vit-large-patch14/resolve/main/onnx/vision_model_fp16.onnx
        if: runner.os == 'macOS'
      - run: npm run ${{ matrix.script }}
      # A tag uploads to its own release. A manual run (Actions > release > Run workflow) rebuilds into the latest one.
      - name: Upload to the release
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="$(gh release view --json tagName --jq .tagName)"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "BlueGuardian AI $TAG" --generate-notes || true
          gh release upload "$TAG" ${{ matrix.files }} --clobber

  website:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run prepare-model
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/web }
      - id: deploy
        uses: actions/deploy-pages@v4
